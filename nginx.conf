# 管理端前端的容器内 nginx 配置。
#
# 两个职责：
#   1. 托管 Vite 构建产物；未命中的路径交回 index.html（react-router 是前端路由）
#   2. 把 /api/ 与 /admin/ 转发给后端，让浏览器只面对一个源，因此不需要任何跨域配置
#
# 端口约定：换环境时改的是 proxy_pass，不需要重建前端产物——见 Dockerfile 里关于构建期变量的说明。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 契约允许单文件 500MB。不放开的话大文件会在 nginx 层就被挡掉，后端根本收不到请求。
    client_max_body_size 500m;

    # 后端接口：契约里管理端用 /admin/*、教师端用 /api/*，两个前缀都要转。
    # 用正则合成一个 location，避免同一段 proxy 配置写两遍。
    location ~ ^/(api|admin)/ {
        proxy_pass http://app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传接口要留够时间：大文件 + 后端写 OSS。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vite 产物文件名带内容哈希，可以长缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 唯一的入口壳必须每次回源，否则改版后浏览器会拿旧壳去要已经不存在的哈希资源。
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 兜底放最后：/licenses、/content/courses 这类前端路由在磁盘上没有对应文件。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
